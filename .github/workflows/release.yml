name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build and Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          ARCHIVE_BASE="igi2rcon-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          BUILD_DIR="build-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p dist "${BUILD_DIR}"
          cp README.md "${BUILD_DIR}/"

          BIN_NAME="igi2rcon"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME="igi2rcon.exe"
          fi

          go build -v -o "${BUILD_DIR}/${BIN_NAME}" .

          # Package releases
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd "${BUILD_DIR}" && zip -r "../dist/${ARCHIVE_BASE}.zip" .)
          else
            tar -czvf "dist/${ARCHIVE_BASE}.tar.gz" -C "${BUILD_DIR}" .
            (cd "${BUILD_DIR}" && zip -r "../dist/${ARCHIVE_BASE}.zip" .)
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
